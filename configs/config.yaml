# C-PrIM Research Configuration

data:
  dataset_root: "../XES3G5M"
  kc_sequences_train: "kc_level/train_valid_sequences.csv"
  kc_sequences_test: "kc_level/test.csv"
  question_metadata: "metadata/questions.json"
  kc_routes_zh: "metadata/kc_routes_map.json"
  kc_routes_en: "metadata/kc_routes_map_en.json"
  cid_embeddings: "metadata/embeddings/cid2content_emb.json"
  max_seq_len: 200
  pad_val: -1
  val_fold: 4 # standard 5-fold cross-validation fold 4 as validation, 0-3 train

graph:
  directed: true
  min_transition_count: 5
  confidence_threshold: 0.6
  export_graph_path: "artifacts/kc_relationship_graph.json"
  export_graph_gml: "artifacts/kc_relationship_graph.gml"

model:
  random_seed: 42
  embedding_dim: 64
  hidden_dim: 64
  gnn_layers: 2
  dropout: 0.2
  learning_rate: 0.001
  batch_size: 128
  epochs: 5
  patience: 3
  device: "cpu" # Auto-detects cuda if available
  baseline_checkpoint: "artifacts/baseline_model.pt"
  gnn_checkpoint: "artifacts/gnn_model.pt"

counterfactual:
  default_intervention_level: 0.85
  intervention_levels: [0.6, 0.75, 0.85, 0.95]
  min_candidate_attempts: 1

api:
  host: "127.0.0.1"
  port: 8000
